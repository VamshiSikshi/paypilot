spring:
  datasource:
    url: jdbc:h2:mem:paypilot_test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

paypilot:
  ai-service:
    base-url: http://localhost:8000

  security:
    jwt:
      secret: test-secret-key-for-paypilot-jwt-testing-only-256-bits
      expiration: 86400000
      issuer: paypilot

  razorpay:
    token-encryption:
      key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      key-version: ${RAZORPAY_TOKEN_ENCRYPTION_KEY_VERSION:v1}